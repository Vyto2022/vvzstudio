# --- HTTPS : main site ---
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    if ($host = www.vvzstudio.com) {
        return 301 https://vvzstudio.com$request_uri;
    }
    server_name vvzstudio.com www.vvzstudio.com;

    root /var/www/vvzstudio;
    index index.html;

    # SSL (certbot)
    ssl_certificate /etc/letsencrypt/live/vvzstudio.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/vvzstudio.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf;

    # [БЕЗОПАСНОСТЬ] Глобальные заголовки
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # [ЗАЩИТА] Запрет скрытых файлов (git, env, и т.д.)
    location ~ /\.(?!well-known) {
        deny all;
        return 404;
        access_log off;
        log_not_found off;
    }

    include /etc/nginx/snippets/vvz-lead-api.conf;

    # --- Static caching ---
    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|svg|webp|ico|woff2|woff|ttf|eot)$ {
        expires 30d;
        # Важно: дублируем заголовки здесь, иначе они пропадут для картинок/скриптов
        add_header Cache-Control "public, max-age=2592000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;

        try_files $uri =404;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }


}
