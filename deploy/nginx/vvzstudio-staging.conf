server {
    listen 80;
    listen [::]:80;
    server_name staging.vvzstudio.com;

    root /var/www/vvzstudio-staging;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://staging.vvzstudio.com$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.vvzstudio.com;

    include /etc/nginx/snippets/vvz-lead-api.conf;

    root /var/www/vvzstudio-staging;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/staging.vvzstudio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/staging.vvzstudio.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location ~ /\.(?!well-known) {
        deny all;
        return 404;
        access_log off;
        log_not_found off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
